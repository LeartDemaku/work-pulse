<!DOCTYPE html>
<html lang="sq">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rivendos fjalëkalimin - WorkPulse</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="LOGO-PunaIme.png">

  <style>
    :root {
      --rp-bg-1: #f8fbff;
      --rp-bg-2: #edf4ff;
      --rp-ink: #0f172a;
      --rp-muted: #51607a;
      --rp-border: #dbe5f4;
      --rp-accent: #2563eb;
      --rp-shadow: 0 22px 50px -28px rgba(15, 23, 42, 0.28);
    }

    body.reset-password-page {
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
    }

    .page-shell {
      max-width: 560px;
      margin: 0 auto;
      padding: 120px 20px 40px;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      padding: 24px;
    }

    .title {
      font-size: 1.7rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--rp-muted);
      margin-bottom: 16px;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    .form label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--rp-muted);
    }

    .form input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      background: var(--bg-body);
      color: var(--text-main);
    }

    .form input:focus {
      outline: none;
      border-color: var(--rp-accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .helper {
      font-size: 0.84rem;
      color: var(--rp-muted);
    }

    .message {
      display: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions .btn {
      min-height: 42px;
    }
  </style>
</head>

<body class="reset-password-page">
  <main class="page-shell">
    <section class="panel">
      <h1 class="title">Rivendos fjalëkalimin</h1>
      <p class="subtitle">Vendosni fjalëkalimin e ri për llogarinë tuaj.</p>

      <div id="resetMessage" class="message"></div>

      <form id="resetPasswordForm" class="form">
        <input type="hidden" id="resetToken">

        <div>
          <label for="newPassword">Fjalëkalimi i ri</label>
          <input type="password" id="newPassword" required minlength="8" placeholder="Të paktën 8 karaktere">
        </div>

        <div>
          <label for="confirmPassword">Përsërit fjalëkalimin</label>
          <input type="password" id="confirmPassword" required minlength="8" placeholder="Përsërit fjalëkalimin">
        </div>

        <p class="helper">Këshillë: përdor një kombinim me shkronja, numra dhe simbole.</p>

        <div class="actions">
          <button type="submit" class="btn btn-primary"><i class="fas fa-key"></i> Ndrysho fjalëkalimin</button>
          <a href="signin.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Kthehu te hyrja</a>
        </div>
      </form>
    </section>
  </main>

  <script src="script/config.js"></script>
  <script src="script/shared/api.js"></script>
  <script src="script/shared/toast.js"></script>
  <script src="script/shared/theme-manager.js"></script>
  <script src="script/reset-password.js"></script>
</body>

</html>
